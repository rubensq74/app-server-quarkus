name: contract-validation

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate OpenAPI contract
        run: ./mvnw -q test
