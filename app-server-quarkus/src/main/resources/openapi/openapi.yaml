openapi: 3.0.3
info:
  title: App Server API
  version: 1.0.0
  description: Contract-first API for the app server example.
servers:
  - url: http://localhost:8080
paths:
  /api/health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/books:
    get:
      summary: List all books
      operationId: listBooks
      responses:
        '200':
          description: Books list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookResponse'
    post:
      summary: Create a new book
      operationId: createBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          description: Validation error
  /api/books/{id}:
    get:
      summary: Get a book by id
      operationId: getBookById
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '404':
          description: Book not found
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok
    BookResponse:
      type: object
      required:
        - id
        - title
        - author
        - available
      properties:
        id:
          type: string
          example: bk-1001
        title:
          type: string
          example: Quarkus in Action
        author:
          type: string
          example: Josh Long
        available:
          type: boolean
          example: true
    CreateBookRequest:
      type: object
      required:
        - title
        - author
      properties:
        title:
          type: string
          minLength: 3
          example: Quarkus in Action
        author:
          type: string
          minLength: 2
          example: Josh Long
